services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-telemetry_local_demo}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 30
  ingest:
    build:
      context: .
      target: ingestion
    environment:
      PIPELINE_MODE: kafka
      SERVER_ADDRESS: 0.0.0.0
      PORT: 8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      DATABASE_URL: jdbc:postgresql://postgres:5432/telemetry
      DATABASE_USER: telemetry
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-telemetry_local_demo}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
    restart: unless-stopped
  gateway:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8090:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [ingest]
  jobmanager:
    build:
      context: .
      target: flink
    command: standalone-job --job-classname io.srimaddireddy.telemetry.stream.TelemetryJob
    ports: ["127.0.0.1:8091:8081"]
    environment: &flink-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      CONFIG_API: http://ingest:8080
      CHECKPOINT_DIR: file:///opt/flink/checkpoints
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
    volumes: ["flink-checkpoints:/opt/flink/checkpoints"]
    depends_on: [ingest]
  taskmanager:
    build:
      context: .
      target: flink
    command: taskmanager
    environment: *flink-env
    volumes: ["flink-checkpoints:/opt/flink/checkpoints"]
    depends_on: [jobmanager]
volumes:
  postgres-data:
  redis-data:
  kafka-data:
  flink-checkpoints:

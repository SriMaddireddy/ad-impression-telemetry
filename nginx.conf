resolver 127.0.0.11 valid=5s;
upstream telemetry_ingestion {
    zone telemetry_ingestion 64k;
    server ingest:8080 resolve;
}
server {
    listen 80;
    client_max_body_size 2m;
    location / {
        proxy_pass http://telemetry_ingestion;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
